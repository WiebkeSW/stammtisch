<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stammtisch</title>
<meta name="description" content="Digitaler Stammtisch — ein großer Tisch statt Kachelwand, gemütlich wie Omas Wohnzimmer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="raum.css">
</head>
<body>

<!-- ===================== Garderobe ===================== -->
<div class="garderobe" id="garderobe">
  <div class="garderobe-karte">
    <div>
      <h1 id="garderobe-titel">Stammtisch</h1>
      <p class="hinweis" style="margin-top:6px;" id="garderobe-unter">Komm rein, setz dich dazu.</p>
    </div>
    <div class="farbband">
      <i style="background:#D9808A"></i><i style="background:#E0A93B"></i>
      <i style="background:#8DB36B"></i><i style="background:#5BA39A"></i><i style="background:#6C8EBF"></i>
    </div>

    <div>
      <span class="feldtitel">Wer bist du?</span>
      <div class="namen" id="namensschilder"></div>
      <input type="text" id="name" maxlength="18" placeholder="Dein Name" autocomplete="off">
      <input type="text" id="rolle" maxlength="22" placeholder="Rolle, falls du eine hast (optional)" autocomplete="off" style="margin-top:8px;">
    </div>

    <div>
      <span class="feldtitel">Was trinkst du?</span>
      <div class="getraenke" id="getraenke-garderobe"></div>
    </div>

    <button class="gross" id="reinkommen" type="button" disabled>Reinkommen</button>

    <p class="hinweis" id="garderobe-hinweis"></p>
  </div>
</div>

<!-- ===================== Lokal ===================== -->
<main class="huelle" id="lokal" hidden>

  <div class="kopfleiste">
    <h1 id="lokal-titel">Stammtisch</h1>
    <span class="status-pille suchend" id="status"><span class="punkt"></span><span id="status-text">verbinde…</span></span>
  </div>

  <!-- Mikro-Leiste: die wichtigste Zeile auf der ganzen Seite, deshalb ganz oben -->
  <button class="mikro-leiste" id="mikro-pille" type="button">
    <span class="mikro-punkt" aria-hidden="true"></span>
    <span class="mikro-text" id="mikro-text">Mikrofon wird angefragt …</span>
  </button>
  <p class="schreib-hinweis" id="schreib-hinweis" hidden>
    Kein Mikrofon? Kein Problem — <strong>du bist trotzdem im Raum</strong> und kannst unten am Tisch mitschreiben.
  </p>

  <div class="raum-huelle">
    <div class="raum" id="raum">
      <div class="teppich"></div>
      <div class="tuer"></div>
      <div class="tuer-schild">Eingang</div>
      <button class="theke" id="zone-theke" type="button" aria-label="An die Kuchentheke stellen"><span>Kuchentheke</span></button>
      <div class="kueche"><span>Offene Backküche</span></div>
      <div class="platte" aria-hidden="true"></div>
      <div class="platte-schild">Plattenspieler</div>
      <div id="tische"></div>
      <div id="murmelringe"></div>
      <div id="stuehle"></div>
      <div id="gaeste"></div>
    </div>
  </div>

  <div class="hoerweite" id="hoerweite"></div>

  <!-- Dein Tisch: Anwesenheit, Redestein und Chat direkt am Geschehen, nicht weit weg -->
  <section class="dein-tisch" id="dein-tisch">
    <div class="dt-kopf">
      <h2 id="deckel-titel">Tischgespräch</h2>
      <div class="dt-wer" id="tisch-wer"></div>
    </div>
    <p class="hinweis" id="deckel-unter"></p>

    <div class="redestein-leiste" id="redestein-leiste" hidden></div>

    <ul class="deckel-liste" id="deckel-liste"></ul>
    <div class="deckel-neu">
      <input type="text" id="deckel-eingabe" maxlength="140" placeholder="Schreib etwas — alle am Tisch sehen es" autocomplete="off">
      <button class="knopf" id="deckel-knopf" type="button">Senden</button>
    </div>
  </section>

  <div class="pult">
    <div class="pult-block">
      <span class="feldtitel">Dein Glas</span>
      <div class="getraenke" id="getraenke-pult"></div>
    </div>
    <div class="pult-block">
      <span class="feldtitel">Der Abend</span>
      <button class="knopf" id="gehen" type="button">Gehen</button>
    </div>
  </div>

  <details class="karte" id="karte">
    <summary>Speisekarte</summary>
    <div class="karte-inhalt" id="karte-inhalt"></div>
  </details>

  <div class="anwesend" id="anwesend"></div>

  <p class="fusszeile" id="fusszeile"></p>
</main>

<div id="toene" hidden></div>

<!-- Kurze Einführung, einmalig -->
<div class="tour" id="tour" hidden>
  <div class="tour-karte">
    <p class="tour-icon" id="tour-icon">👀</p>
    <h3 id="tour-titel"></h3>
    <p id="tour-text"></p>
    <div class="tour-fuss">
      <div class="tour-punkte" id="tour-punkte"></div>
      <div class="tour-knoepfe">
        <button class="tour-ueberspringen" id="tour-ueberspringen" type="button">Überspringen</button>
        <button class="knopf an" id="tour-weiter" type="button">Weiter</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="raum.js"></script>
</body>
</html>
